---
apiVersion: v1
kind: Namespace
metadata:
  name: kassette-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: kassette-e2e
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/instance: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/instance: demo
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: kassette-e2e
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: demo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: demo
  ports:
    - name: http
      port: 80
