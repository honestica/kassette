version: 2.1

orbs:
  bot: lifen/bot@0

workflows:
  version: 2
  daily_sast_scan: # DO NOT CHANGE THE WORKFLOW NAME
    triggers:
      - schedule:
          cron: "0 1 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - bot/sast:
          context: org-global

  sast_scan:
    jobs:
      - bot/sast:
          context: org-global
          filters:
            branches:
              ignore:
                - master
